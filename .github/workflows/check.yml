name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v
      - run: node --check web/dashboard.js && node --check web/controller.js && node --check web/activity.js
      - run: shellcheck open-panel.sh run-project.sh
      - run: python -m compileall -q scripts
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --prefix qa
      - run: cd qa && npx playwright install --with-deps webkit
      - run: npm test --prefix qa
